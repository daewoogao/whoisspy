<style>

  --bg:#eef0f6; --card:#ffffff; --ink:#1b1f3a; --muted:#5b6185; --line:#d6d9e8;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142a; --card:#1c1f3d; --ink:#eceefb; --muted:#a3a8cc; --line:#2f3360;
  --accent:#8f93ff; --accent-ink:#12142a; --stamp:#ff7a6e; --good:#4fd39a; --chip:#2a2e5a; color-scheme:dark}}

.levels{display:grid; gap:8px}

.or{display:flex; align-items:center; gap:12px; margin:10px 0 4px; color:var(--muted); font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.08em}

a{color:var(--accent)}

function makePeerRoom(code, asHost){
  const HOST_ID = "whoisspy-club-" + code;
  const ls = [], cs = [];

      c.on("open", () => { conns.set(c.peer, c); try{ c.send({t:"peers", list:list()}); }catch(e){} });

    });
    peer.on("disconnected", () => { if(!closed) setTimeout(() => { try{ peer.reconnect(); }catch(e){} }, 1500); });
    peer.on("error", e => {
      // After a reload the server can hold the old host id for a few seconds: keep trying.
      if(e.type === "unavailable-id" && attempt < 20 && !closed){ try{ peer.destroy(); }catch(x){} setTimeout(() => startHost(attempt + 1), 1500); }
      else if(e.type === "network" || e.type === "server-error" || e.type === "socket-error") setConn(false);
    });
  }
  function dial(){
    if(closed) return;
    const c = peer.connect(HOST_ID, {reliable:true});
    hostConn = c;
    c.on("open", () => { setConn(true); try{ c.send({t:"p", pr:mine}); }catch(e){} });
    c.on("data", m => {
      if(m && m.t === "peers" && Array.isArray(m.list)){ peers = new Map(m.list); peers.set(myId, mine); emitPeers(); }
    });
    c.on("close", () => { setConn(false); peers = new Map([[myId, mine]]); emitPeers(); retry(); });
    c.on("error", () => retry());
  }
  function retry(){ if(closed || retryT) return; retryT = setTimeout(() => { retryT = null; if(!hostConn || !hostConn.open) dial(); }, 2500); }
  function startPlayer(){
    peer = new Peer();
    peer.on("open", id => { myId = id; peers.set(id, mine); emitPeers(); dial(); });
    peer.on("error", e => { if(e.type === "peer-unavailable"){ setConn(false); retry(); } });
    peer.on("disconnected", () => { if(!closed) setTimeout(() => { try{ peer.reconnect(); }catch(e){} }, 1500); });
  }

    name: HOST_ID,
    onPeers(f){ ls.push(f); setTimeout(() => f({peers:snap(), joined:[], left:[], updated:[]}), 0); return () => {}; },
    onConnection(f){ cs.push(f); setTimeout(() => f(connected), 0); return () => {}; },
    peers: snap,
    connected: () => connected,
    async presence(patch){
      for(const k in patch){ if(patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      mine = Object.assign({}, mine);
      if(myId) peers.set(myId, mine);
      if(asHost){ emitPeers(); broadcast(); }
      else if(hostConn && hostConn.open){ try{ hostConn.send({t:"p", pr:mine}); }catch(e){} emitPeers(); }
    },
    async leave(){ closed = true; try{ if(hostConn) hostConn.close(); }catch(e){} try{ peer.destroy(); }catch(e){} }
  };
}

// ---- room plumbing ----
async function enter(code, name, asHost){
  L.err = "";
  if(!L.api){ L.err = t("Not connected yet.", "还没连上。"); return render(); }
  try{
    L.R = await L.api.join("wis-" + code.toLowerCase(), {code, host: asHost});
  }catch(e){ L.err = t("Couldn't open the club (", "打不开房间（") + (e && e.code || "error") + t("). Try again.", "）。请再试一次。"); return render(); }
  L.code = code; L.name = name; L.isHost = asHost; L.joinedAt = Date.now();
  store.set("wis-me", {code, name, host: asHost, at: Date.now()});
  L.skipInvite = true;
  L.R.onPeers(ch => { L.peers = ch.peers; const me = ch.peers.find(p => p.sameTab); if(me) L.me = me.peer; tick(); }, () => {});
  L.R.onConnection(c => { L.connected = c; render(); }, () => {});
  if(asHost){
    const saved = store.get("wis-host", null);
    H = saved && saved.code === code ? saved : newHost(code);
    saveHost();
  }
  pushPresence();
  render();
  setTimeout(render, 6500);
}
async function leave(){
  try{ if(L.R) await L.R.leave(); }catch(e){}
  L.R = null; L.code = null; L.isHost = false; L.peers = []; H = null; lastPresence = "";
  L.skipInvite = true;
  render();
}
function pushPresence(extra){
  if(!L.R) return;
  const p = Object.assign({n: L.name, h: L.isHost ? 1 : 0}, extra || {});
  if(L.isHost && H) p.st = project();
  const j = JSON.stringify(p);
  if(j === lastPresence) return;
  lastPresence = j;
  const me = store.get("wis-me", null); if(me && me.code === L.code) store.set("wis-me", Object.assign(me, {at: Date.now()}));
  L.R.presence(p).catch(() => {});
}
let myVote = null;   // {vid, t}
function vote(target){ myVote = {vid: st().vid, t: target}; pushPresence({v: myVote}); render(); }

// Called on every room change.
function tick(){
  if(L.isHost && H){ hostSync(); pushPresence(myVote ? {v: myVote} : null); }
  render();
}

// ---- host engine ----
function newHost(code){ return {code, level:1, cat:"All", lang:"en", scores:{}, startedBy:[], used:[], game:null}; }
function saveHost(){ store.set("wis-host", H); }
const present = () => L.peers.filter(p => p.kind === "viewer" && p.presence && cleanName(p.presence.n));
function lobbyNames(){
  const seen = {}, out = [];
  present().forEach(p => { const b = cleanName(p.presence.n); seen[b] = (seen[b]||0)+1; out.push({p: p.peer, b, n: seen[b] > 1 ? b + " " + seen[b] : b}); });
  return out;
}
function hostSync(){
  const G = H.game; if(!G) return;
  const here = new Set(present().map(p => p.peer));
  // A player who reloaded comes back as a new peer with the same name: give them their seat back.
  G.P.forEach(x => {
    if(here.has(x.p)) return;
    const back = present().find(p => cleanName(p.presence.n) === x.b && !G.P.some(y => y.p === p.peer));
    if(back) x.p = back.peer;
  });
  if(G.ph === "vote"){
    const votes = collectVotes();
    const voters = G.P.filter(x => canVote(x) && here.has(x.p));
    if(voters.length && voters.every(x => votes.has(x.p))) tally();
  }
}
// In a tie-break the tied players don't vote; everyone else picks between them.
const canVote = x => x.a && !(H.game.tie && H.game.cd.includes(x.p));
function collectVotes(){
  const G = H.game, m = new Map();
  present().forEach(p => {
    const v = p.presence.v, me = G.P.find(x => x.p === p.peer);
    if(me && canVote(me) && v && v.vid === G.vid && G.cd.includes(v.t) && v.t !== p.peer) m.set(p.peer, v.t);
  });
  return m;
}
function pickPair(){
  const cats = H.cat === "All" ? Object.keys(BANK) : [H.cat];
  // Pairs tagged "en" or "zh" only work in that language; Both mode uses untagged pairs only.
  const fits = p => H.lang === "both" ? !p[4] : (!p[4] || p[4] === H.lang);
  const pool = cats.flatMap(c => BANK[c]).filter(fits);
  // No repeats: this phone remembers every pair it has dealt (across clubs) until the pool runs out.
  let played = store.get("wis-played", []);
  let fresh = pool.filter(p => !played.includes(pairKey(p)));
  if(!fresh.length){ const inPool = new Set(pool.map(pairKey)); played = played.filter(k => !inPool.has(k)); fresh = pool; }
  // Pairs this phone voted down more than up come last.
  const r = p => L.ratings[pairKey(p)] || {up:0, down:0};
  const ok = fresh.filter(p => r(p).down <= r(p).up);
  const cand = ok.length ? ok : fresh;
  const p = cand[Math.floor(Math.random() * cand.length)];
  played.push(pairKey(p)); store.set("wis-played", played);
  return p;
}
const wordText = w => !w ? "" : H.lang === "en" ? w.en : H.lang === "zh" ? w.zh : `${w.en} · ${w.zh}`;
function startGame(){
  const ps = lobbyNames();
  if(ps.length < 3) return;
  const p = pickPair();
  const A = {en:p[0], zh:p[1]}, B = {en:p[2], zh:p[3]};
  const [com, spyW] = Math.random() < .5 ? [A,B] : [B,A];
  const P = ps.map(x => ({p:x.p, b:x.b, n:x.n, r:"c", w:wordText(com), a:true}));
  const idx = shuffle(P.map((_,i)=>i)), lv = H.level, spies = lv >= 4 ? 2 : 1;
  idx.slice(0, spies).forEach((k, j) => { P[k].r = "s"; P[k].w = (lv === 4 && j === 1) ? "" : wordText(spyW); });
  const rest = idx.slice(spies);
  if(lv === 2) rest.slice(0,2).forEach(k => P[k].w = "");
  if(lv === 3 || lv === 5) rest.forEach(k => P[k].w = "");
  // Each game a different starter: random among players who haven't started yet in this club.
  let left = P.filter(x => !H.startedBy.includes(x.n));
  if(!left.length){ H.startedBy = []; left = P; }
  const s = left[Math.floor(Math.random()*left.length)];
  H.startedBy.push(s.n);
  H.game = {gid: Date.now(), pk: pairKey(p), cw: wordText(com), sw: wordText(spyW), P, st: s.n, rd: 1, ph: "describe", vid: 0, cd: [], tie: false, lo: "", win: ""};
  myVote = null; saveHost(); tick();
}
function startVote(cands){
  const G = H.game; G.vid = Date.now(); G.cd = cands; G.ph = "vote"; myVote = null;
  if(!G.P.some(canVote)) return tally();
  saveHost(); tick();
}
function tally(){
  const G = H.game, votes = collectVotes(), count = {};
  votes.forEach(t => count[t] = (count[t]||0) + 1);
  const keys = Object.keys(count);
  if(!keys.length){ G.tie = false; G.lo = ""; G.ph = "nobody"; return done(); }
  const max = Math.max(...Object.values(count)), top = keys.filter(k => count[k] === max);
  if(top.length > 1){
    if(G.tie){ G.tie = false; G.lo = ""; G.ph = "nobody"; return done(); }
    G.tie = true; G.cd = top; G.ph = "tie"; return done();
  }
  G.tie = false;
  const out = G.P.find(x => x.p === top[0]); out.a = false; G.lo = out.n;
  // Commoners win once every spy is out. Otherwise spies win at 2 players left (one-spy levels) or 3 (two-spy levels).
  if(!G.P.some(x => x.r === "s" && x.a)) return finish("c");
  const spies = G.P.filter(x => x.r === "s").length, living = G.P.filter(x => x.a).length;
  if(living <= (spies >= 2 ? 3 : 2)) return finish("s");
  G.ph = "out"; done();
}
function finish(side){
  const G = H.game; G.win = side; G.ph = "over";
  G.P.forEach(x => { if(x.r === side) H.scores[x.n] = (H.scores[x.n]||0) + (side === "s" ? 2 : 1); });
  done();
}
function done(){ myVote = null; saveHost(); pushPresence(); render(); }
function nextRound(){ const G = H.game; G.rd++; G.ph = "describe"; G.vid = 0; myVote = null; saveHost(); tick(); }

// What the host shares with every phone (kept small: presence is capped at 4 KiB).
function project(){
  const G = H.game, base = {code:H.code, lv:H.level, lang:H.lang, cat:H.cat, sc:Object.entries(H.scores).sort((a,b)=>b[1]-a[1]).slice(0,30)};
  if(!G || G.ph === "lobby") return Object.assign(base, {ph:"lobby", lob: lobbyNames().map(x => x.n).slice(0,40)});
  const o = Object.assign(base, {ph:G.ph, gid:G.gid, rd:G.rd, st:G.st, vid:G.vid, cd:G.cd, tie:G.tie?1:0, lo:G.lo, win:G.win, pk:G.pk,
    pl: G.P.map(x => [x.p, x.n, x.a?1:0]), w: Object.fromEntries(G.P.map(x => [x.p, x.w]))});
  if(G.ph === "vote"){ const v = collectVotes(); o.nv = v.size; o.nt = G.P.filter(canVote).length; }
  if(G.ph === "over"){ o.ro = Object.fromEntries(G.P.map(x => [x.p, x.r])); o.cw = G.cw; o.sw = G.sw; }
  return o;
}

// ---- what every phone reads ----
function hostPeer(){ return L.peers.find(p => p.presence && p.presence.h === 1 && p.presence.st && p.presence.st.code === L.code); }
function st(){ if(L.isHost && H) return project(); const h = hostPeer(); return h ? h.presence.st : null; }

    </table>
    <p class="muted">"Blank" means you see no word. Listen to the others and blend in.</p>
    <h2>Points</h2>
    <p>Spies win: 2 points for each spy. Commoners win: 1 point for every commoner, including blanks and anyone voted out earlier.</p>
    <h2>Tips</h2>
    <ul>
      <li>Be vague enough that the spy can't guess your word, but clear enough that your team trusts you.</li>
      <li>If the others' clues don't fit your word, you might be the spy. Keep your clues true to your word, but pick something your word shares with theirs so you blend in.</li>
    </ul>
    <button class="primary" id="rb">${S ? "Back to the game" : "Got it"}</button>
  </section>`, () => { byId("rb").onclick = closeRules; });
}
function closeRules(){ L.showRules = false; lastHtml = ""; window.scrollTo(0,0); render(); }
function levelCard(n){ const l = LEVELS[n-1]; return `<b>${l.n}</b><span>${esc(lvTitle(l))}<small>${esc(lvDesc(l))}${t(` Suggested: ${l.min}+ players.`, `建议${l.min}人以上。`)}</small></span>`; }
function lobby(S){
  const names = S.lob || [], n = names.length, Lv = LEVELS[S.lv-1];
  const list = `<ul class="list">${names.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ul>`;
  const inClub = `<p class="tag">${t(`${n} in the club`, `房间里${n}人`)}</p>`;
  if(!L.isHost) return paint(`<section class="card"><span class="tag">${t("Club", "房间")} ${esc(S.code)}</span>
    <h1>${t("You're in. Waiting for the host to start", "你已加入，等房主开始")}</h1>
    <p class="muted">${t(`Level ${S.lv}: `, `第${S.lv}关：`)}${esc(lvTitle(Lv))}${t(". ", "。")}${esc(lvDesc(Lv))}</p>
    ${inClub}${list}${board(S)}</section>`);
  paint(`<section class="card"><span class="tag">${t("Your club code", "你的房间号")}</span>
    <div class="bigcode">${esc(S.code)}</div>
    <p class="muted">${t("Friends open this same page on their phone, tap <b>Join club</b> and type the code.", "朋友在自己手机上打开这个页面，点<b>加入房间</b>，输入房间号。")}${L.api && L.api.kind === "peer" ? "" : t(" Each friend needs access to the page first: add their email in the Share menu.", " 每个朋友要先有页面权限：在分享菜单里添加他们的邮箱。")}</p>
    ${L.api && L.api.kind === "peer" ? `<div class="field"><label for="invurl">${t("Invite link", "邀请链接")}</label><input id="invurl" readonly value="${esc(inviteUrl(S.code))}"></div>
    <div class="row"><button id="inv">${t("Copy link", "复制链接")}</button>${navigator.share ? `<button id="shr">${t("Share…", "分享…")}</button>` : ""}</div><p class="muted" id="invok" ${L.invMsg ? "" : "hidden"}>${esc(L.invMsg || "")}</p>` : ""}
    ${inClub}${list}</section>
    <section class="card">
    <div class="field"><label>${t("Level", "关卡")}</label><div class="levels">${LEVELS.map(l => `<button class="level" data-l="${l.n}" aria-pressed="${S.lv===l.n}">${levelCard(l.n)}</button>`).join("")}</div></div>
    <div class="row">
      <div class="field"><label for="cat">${t("Category", "类别")}</label><select id="cat">${["All",...Object.keys(BANK)].map(c => `<option value="${esc(c)}" ${c===S.cat?"selected":""}>${esc(catName(c))}</option>`).join("")}</select></div>
      <div class="field"><label for="lang">${t("Words in", "词语语言")}</label><select id="lang">
        <option value="en" ${S.lang==="en"?"selected":""}>English</option><option value="zh" ${S.lang==="zh"?"selected":""}>中文</option><option value="both" ${S.lang==="both"?"selected":""}>${t("Both", "中英都有")}</option></select></div>
    </div>
    <p class="warn" ${n >= 3 && n < Lv.min ? "" : "hidden"}>${t(`Level ${Lv.n} plays best with ${Lv.min} or more players. You can still play.`, `第${Lv.n}关最好有${Lv.min}人或以上。人少也可以玩。`)}</p>
    <button class="primary" id="go" ${n < 3 ? "disabled" : ""}>${n < 3 ? t("Need at least 3 players", "至少需要3人") : t("Deal the words", "发词")}</button>
    </section>${S.sc.length ? `<section class="card">${board(S, true)}</section>` : ""}
    <p class="foot">${t(`Closed this page by accident? Open the site again and type ${esc(S.code)}. This phone stays the host.`, `不小心关掉了页面？重新打开网站，输入 ${esc(S.code)}。这部手机仍然是房主。`)}</p>`, () => {
    app.querySelectorAll(".level").forEach(b => b.onclick = () => { H.level = +b.dataset.l; saveHost(); tick(); });
    byId("cat").onchange = e => { H.cat = e.target.value; saveHost(); tick(); };
    byId("lang").onchange = e => { H.lang = e.target.value; saveHost(); tick(); };
    byId("go").onclick = startGame;
    const inv = byId("inv"); if(inv) inv.onclick = async () => {
      const url = inviteUrl(S.code), box = byId("invurl");
      let copied = false;
      try{ await navigator.clipboard.writeText(url); copied = true; }catch(e){}
      if(!copied){ try{ box.focus(); box.select(); box.setSelectionRange(0, url.length); copied = document.execCommand("copy"); }catch(e){} }
      L.invMsg = copied ? t("Link copied. Paste it in your group chat.", "链接已复制，粘贴到群聊里吧。") : t("Press and hold the link above to copy it.", "长按上面的链接来复制。");
      lastHtml = ""; render();
    };
    const shr = byId("shr"); if(shr) shr.onclick = async () => {
      try{ await navigator.share({title:"WhoIsSpy", text:t("Join my WhoIsSpy club ", "来加入我的谁是卧底房间 ") + S.code, url: inviteUrl(S.code)}); }
      catch(e){ if(e && e.name !== "AbortError"){ L.invMsg = t("Sharing didn't work here. Use Copy link instead.", "这里没法分享，请用复制链接。"); lastHtml = ""; render(); } }
    };
    const rs = byId("rs"); if(rs) rs.onclick = () => { H.scores = {}; saveHost(); tick(); };
  });
}
function board(S, host){
  if(!S.sc || !S.sc.length) return "";
  return `<h2>${t("Scoreboard", "积分榜")}</h2><p class="muted">${t("Spy win: 2 points each. Commoner win: 1 point each.", "卧底获胜：每人2分。平民获胜：每人1分。")}</p>
    <ul class="list">${S.sc.map(([n,s]) => `<li><span>${esc(n)}</span><span class="score">${s}</span></li>`).join("")}</ul>
    ${host && L.isHost ? `<button id="rs">${t("Reset scoreboard", "积分清零")}</button>` : ""}`;
}

function game(S, meIn){
  const nameOf = p => { const x = S.pl.find(y => y[0] === p); return x ? x[1] : "?"; };
  const alive = meIn[2] === 1, myWord = S.w ? S.w[L.me] : "";
  const starterIn = S.pl.some(x => x[1] === S.st && x[2] === 1);
  const roster = `<ul class="list">${S.pl.map(x => `<li class="${x[2] ? "" : "out"}"><span>${esc(x[1])}${x[0]===L.me ? t(" (you)", "（你）") : ""}</span>${x[1]===S.st && x[2] ? `<span class="chip">${t("Starts", "先说")}</span>` : ""}</li>`).join("")}</ul>`;
  const reveal = `<div class="reveal" id="rv" tabindex="0" role="button" aria-label="${t("Hold to see your word", "按住查看你的词")}"><div id="rvt"><span class="muted">${t("Hold to see your word", "按住查看你的词")}</span></div></div>`;
  const tag = `<span class="tag">${t(`Level ${S.lv} · Round ${S.rd}`, `第${S.lv}关 · 第${S.rd}轮`)}${alive ? "" : t(" · You're out", " · 你已出局")}</span>`;
  let body = "", host = "", bind = null;
  if(S.ph === "describe"){
    body = `${tag}<h1>${starterIn ? t(`${esc(S.st)} starts`, `${esc(S.st)} 先说`) : t(`${esc(S.st)} is out`, `${esc(S.st)} 已出局`)}</h1>
      <p class="muted">${starterIn ? t("Then go clockwise around the table.", "然后按顺时针轮流。") : t("The next person clockwise who is still in starts, then go clockwise.", "由顺时针方向下一个还在场的人先说，然后顺时针轮流。")}${t(" Say one clue about your own word, out loud. It must be true about your word.", "大声说一句描述你自己词的话，必须符合你的词。")}</p>
      ${alive ? reveal : `<p class="muted">${t("You're out. Stay quiet and watch.", "你已出局，请安静观看。")}</p>`}${roster}`;
    host = `<button class="primary" id="hx">${S.rd === 1 ? t("Everyone has spoken, next round", "大家都说完了，下一轮") : t("Everyone has spoken, vote", "大家都说完了，投票")}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = () => S.rd === 1 ? nextRound() : startVote(H.game.P.filter(x => x.a).map(x => x.p)); };
  } else if(S.ph === "vote"){
    const mine = myVote && myVote.vid === S.vid ? myVote.t : null;
    const opts = S.cd.filter(p => p !== L.me);
    const tied = S.tie && S.cd.includes(L.me), canV = alive && !tied;
    body = `<span class="tag">${S.tie ? t("Tie-break vote", "平票重投") : t("Secret vote", "秘密投票")} · ${t(`Round ${S.rd}`, `第${S.rd}轮`)}</span>
      ${!alive ? `<h1>${t("Voting", "投票中")}</h1><p class="muted">${t("You're out, so you don't vote this time.", "你已出局，这次不投票。")}</p>`
        : tied ? `<h1>${t("Everyone else is voting", "其他人正在投票")}</h1><p class="muted">${t("You're one of the tied players, so you don't vote this time.", "你是平票的人之一，这次不投票。")}</p>`
        : mine ? `<h1>${t("Vote in", "已投票")}</h1><p class="muted">${t(`You picked ${esc(nameOf(mine))}. Waiting for everyone else. Tap another name to change it.`, `你选了 ${esc(nameOf(mine))}。等其他人投票。点别的名字可以改票。`)}</p>`
        : `<h1>${t("Who is the spy?", "谁是卧底？")}</h1><p class="muted">${t("Tap one name. Nobody will see who you picked.", "点一个名字。没人会知道你选了谁。")}</p>`}
      ${canV ? `<div class="picks">${opts.map(p => `<button class="pick" data-p="${esc(p)}" aria-pressed="${mine===p}" ${mine===p ? 'style="border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)"' : ""}>${esc(nameOf(p))}</button>`).join("")}</div>` : ""}
      ${alive ? reveal : ""}`;
    host = `<p class="muted">${t(`${S.nv} of ${S.nt} have voted. The result shows as soon as everyone has.`, `${S.nt}人中已有${S.nv}人投票。大家都投完就显示结果。`)}</p><button id="hx">${t("End the vote now", "现在结束投票")}</button>`;
    bind = () => { app.querySelectorAll(".pick").forEach(b => b.onclick = () => vote(b.dataset.p)); const b = byId("hx"); if(b) b.onclick = tally; };
  } else if(S.ph === "tie"){
    body = `<span class="stamp">${t("Tie vote", "平票")}</span><h1>${t(`${S.cd.map(p => esc(nameOf(p))).join(" and ")} are tied`, `${S.cd.map(p => esc(nameOf(p))).join("和")}平票`)}</h1>
      <p class="muted">${t("Only they describe their word once more. Then everyone else votes between just them. The tied players don't vote.", "只有平票的人再描述一次自己的词。然后其他人只在他们之中投票。平票的人不投票。")}</p>${alive ? reveal : ""}`;
    host = `<button class="primary" id="hx">${t("They've spoken, vote again", "说完了，重新投票")}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = () => startVote(H.game.cd); };
  } else if(S.ph === "nobody"){
    body = `<span class="stamp">${t("Tied again", "再次平票")}</span><h1>${t("Nobody is out this round", "这一轮没有人出局")}</h1><p class="muted">${t("Play moves on to the next round.", "游戏进入下一轮。")}</p>`;
    host = `<button class="primary" id="hx">${t(`Start round ${S.rd + 1}`, `开始第${S.rd + 1}轮`)}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = nextRound; };
  } else if(S.ph === "out"){
    body = `<span class="stamp">${t("Voted out", "出局")}</span><h1>${t(`${esc(S.lo)} is out`, `${esc(S.lo)} 出局了`)}</h1>
      <p class="muted">${S.lo === meIn[1] ? t("That's you. Keep your word to yourself until the end.", "就是你。游戏结束前别说出你的词。") : t("Their word stays secret until the game ends. The game goes on.", "出局者的词在游戏结束前保密。游戏继续。")}</p>${roster}`;
    host = `<button class="primary" id="hx">${t(`Start round ${S.rd + 1}`, `开始第${S.rd + 1}轮`)}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = nextRound; };
  } else if(S.ph === "over"){
    return over(S);
  }
  paint(`<section class="card">${body}${L.isHost ? `<div class="hostbar"><span class="tag">${t("Host", "房主")}</span>${host}</div>` : ""}</section>`, () => {
    bind && bind();
    const rv = byId("rv"), rt = byId("rvt");
    if(!rv) return;
    const show = on => { rv.classList.toggle("on", on); rt.innerHTML = on ? (myWord ? `<div class="word">${esc(myWord)}</div>` : t(`<div class="word">You have no word</div><p class="muted">你没有词 · listen and blend in</p>`, `<div class="word">你没有词</div><p class="muted">听别人怎么说，想办法混进去</p>`)) : `<span class="muted">${t("Hold to see your word", "按住查看你的词")}</span>`; };
    rv.addEventListener("pointerdown", e => { e.preventDefault(); show(true); });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => rv.addEventListener(ev, () => show(false)));
    rv.addEventListener("contextmenu", e => e.preventDefault());
    rv.addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); show(true); } });
    rv.addEventListener("keyup", () => show(false));
  });
}

function over(S){
  const spy = S.win === "s", r = L.rated[S.gid] || null;
  paint(`<section class="card">
    <span class="stamp ${spy ? "" : "good"}">${spy ? t("Spies win", "卧底获胜") : t("Commoners win", "平民获胜")}</span>
    <h1>${S.lo ? t(`${esc(S.lo)} was voted out. `, `${esc(S.lo)} 被投出局。`) : ""}${spy ? t("The spies made it to the end.", "卧底撑到了最后。") : t("Every spy has been caught.", "所有卧底都被找出来了。")}</h1>
    <p class="muted">${t("Commoner word: ", "平民词：")}<b>${esc(S.cw)}</b> · ${t("Spy word: ", "卧底词：")}<b>${esc(S.sw)}</b></p>
    <ul class="list">${S.pl.map(x => `<li><span>${esc(x[1])} · ${S.w[x[0]] ? esc(S.w[x[0]]) : `<i>${t("blank", "白板")}</i>`}</span><span class="chip ${S.ro[x[0]]==="s" ? "spy" : ""}">${S.ro[x[0]]==="s" ? t("Spy", "卧底") : t("Commoner", "平民")}</span></li>`).join("")}</ul>
  </section>
  <section class="card"><h2>${t("Fun pair?", "这对词好玩吗？")}</h2>
    <div class="thumbs"><button id="up" aria-pressed="${r==="up"}">👍 ${t("Yes", "好玩")}</button><button id="dn" aria-pressed="${r==="down"}">👎 ${t("No", "不好玩")}</button></div>
    <p class="muted">${t("For now ratings stay on your phone. Later they'll count across all clubs.", "目前评分只保存在你的手机上，以后会汇总所有房间的评分。")}</p></section>
  <section class="card">${board(S, true)}
    ${L.isHost ? `<div class="row"><button class="primary" id="again">${t("Play again", "再玩一局")}</button><button id="lob">${t("Change level", "换关卡")}</button></div>` : `<p class="muted">${t("The host starts the next game.", "由房主开始下一局。")}</p>`}
  </section>`, () => {
    const rate = v => {
      const k = S.pk, cur = L.ratings[k] || {up:0, down:0}, was = L.rated[S.gid];
      if(was) cur[was]--; if(was === v){ L.rated[S.gid] = null; } else { cur[v]++; L.rated[S.gid] = v; }
      L.ratings[k] = cur; store.set("wis-ratings", L.ratings); render();
    };
    byId("up").onclick = () => rate("up"); byId("dn").onclick = () => rate("down");
    const a = byId("again"); if(a) a.onclick = startGame;
    const lb = byId("lob"); if(lb) lb.onclick = () => { H.game = null; saveHost(); tick(); };
    const rs = byId("rs"); if(rs) rs.onclick = () => { H.scores = {}; saveHost(); tick(); };
  });
}

// ---- language switch (header) ----
function langUi(){
  document.documentElement.lang = t("en", "zh-Hans");
  const b = byId("langBtn");
  b.textContent = t("中文", "EN"); b.lang = t("zh-Hans", "en");
  b.setAttribute("aria-label", t("切换到中文", "Switch to English"));
  byId("foot").textContent = t("Everyone opens this page on their own phone. One person creates the club, the rest join with its code.", "每人在自己手机上打开这个页面。一个人创建房间，其他人用房间号加入。");
}
byId("langBtn").onclick = () => { UI = UI === "zh" ? "en" : "zh"; store.set("wis-ui", UI); L.invMsg = ""; lastHtml = ""; render(); };

// ---- boot ----
byId("rulesBtn").onclick = () => { L.showRules ? closeRules() : (L.showRules = true, lastHtml = "", window.scrollTo(0,0), render()); };
try{ if(new URLSearchParams(location.search).has("rules")) L.showRules = true; }catch(e){}
render();
(async () => {
  let api = null;
  if(window.Peer) api = peerNet;
  else try{ api = window.claude && window.claude.use ? await window.claude.use("room") : null; }catch(e){ api = null; }
  L.api = api;
  render();
})();
</script>

</body>
</html>
