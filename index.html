<style>
/* One phone-width card per screen. Every phone shows the same screen; the host's phone also gets the controls. */
:root{
  --bg:#eef0f6; --card:#ffffff; --ink:#1b1f3a; --muted:#5b6185; --line:#d6d9e8;

  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142a; --card:#1c1f3d; --ink:#eceefb; --muted:#a3a8cc; --line:#2f3360;
  --accent:#8f93ff; --accent-ink:#12142a; --stamp:#ff7a6e; --good:#4fd39a; --chip:#2a2e5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142a; --card:#1c1f3d; --ink:#eceefb; --muted:#a3a8cc; --line:#2f3360;
  --accent:#8f93ff; --accent-ink:#12142a; --stamp:#ff7a6e; --good:#4fd39a; --chip:#2a2e5a; color-scheme:dark}

.rulesbtn{font:800 13px/1 var(--body); padding:8px 12px; border-radius:999px}

.logo{font:800 22px/1 var(--display); letter-spacing:-.01em}

  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },

};

};

// ---- direct phone-to-phone link (public website) ----
// The host phone registers the club code with the free PeerJS server; every other phone
// connects straight to it. The host keeps everyone's "presence" and sends the full list back.
const peerNet = {
  kind: "peer",
  join: async (_name, opt) => makePeerRoom(opt.code, opt.host)
};
function makePeerRoom(code, asHost){
  const HOST_ID = "whoisspy-club-" + code;
  const ls = [], cs = [];
  let peer = null, myId = null, peers = new Map(), mine = {}, conns = new Map(), hostConn = null, connected = false, closed = false, retryT = null;
  const snap = () => [...peers.entries()].map(([id, pr]) => ({peer:id, by:null, isMe:id===myId, sameTab:id===myId, kind:"viewer", guest:false, presence:pr, updatedAt:Date.now()}));
  const emitPeers = () => { const s = snap(); ls.forEach(f => f({peers:s, joined:[], left:[], updated:[]})); };
  const setConn = c => { if(connected !== c){ connected = c; cs.forEach(f => f(c)); } };
  const list = () => [...peers.entries()];
  const broadcast = () => conns.forEach(c => { if(c.open) try{ c.send({t:"peers", list:list()}); }catch(e){} });
  function startHost(attempt){
    peer = new Peer(HOST_ID);
    peer.on("open", id => { myId = id; peers.set(id, mine); setConn(true); emitPeers(); });
    peer.on("connection", c => {
      c.on("open", () => { conns.set(c.peer, c); try{ c.send({t:"peers", list:list()}); }catch(e){} });
      c.on("data", m => { if(m && m.t === "p" && m.pr && typeof m.pr === "object"){ peers.set(c.peer, m.pr); emitPeers(); broadcast(); } });
      c.on("close", () => { conns.delete(c.peer); peers.delete(c.peer); emitPeers(); broadcast(); });
      c.on("error", () => {});
    });
    peer.on("disconnected", () => { if(!closed) setTimeout(() => { try{ peer.reconnect(); }catch(e){} }, 1500); });
    peer.on("error", e => {
      // After a reload the server can hold the old host id for a few seconds: keep trying.
      if(e.type === "unavailable-id" && attempt < 20 && !closed){ try{ peer.destroy(); }catch(x){} setTimeout(() => startHost(attempt + 1), 1500); }
      else if(e.type === "network" || e.type === "server-error" || e.type === "socket-error") setConn(false);
    });
  }
  function dial(){
    if(closed) return;
    const c = peer.connect(HOST_ID, {reliable:true});
    hostConn = c;
    c.on("open", () => { setConn(true); try{ c.send({t:"p", pr:mine}); }catch(e){} });
    c.on("data", m => {
      if(m && m.t === "peers" && Array.isArray(m.list)){ peers = new Map(m.list); peers.set(myId, mine); emitPeers(); }
    });
    c.on("close", () => { setConn(false); peers = new Map([[myId, mine]]); emitPeers(); retry(); });
    c.on("error", () => retry());
  }
  function retry(){ if(closed || retryT) return; retryT = setTimeout(() => { retryT = null; if(!hostConn || !hostConn.open) dial(); }, 2500); }
  function startPlayer(){
    peer = new Peer();
    peer.on("open", id => { myId = id; peers.set(id, mine); emitPeers(); dial(); });
    peer.on("error", e => { if(e.type === "peer-unavailable"){ setConn(false); retry(); } });
    peer.on("disconnected", () => { if(!closed) setTimeout(() => { try{ peer.reconnect(); }catch(e){} }, 1500); });
  }
  asHost ? startHost(0) : startPlayer();
  return {
    name: HOST_ID,
    onPeers(f){ ls.push(f); setTimeout(() => f({peers:snap(), joined:[], left:[], updated:[]}), 0); return () => {}; },
    onConnection(f){ cs.push(f); setTimeout(() => f(connected), 0); return () => {}; },
    peers: snap,
    connected: () => connected,
    async presence(patch){
      for(const k in patch){ if(patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      mine = Object.assign({}, mine);
      if(myId) peers.set(myId, mine);
      if(asHost){ emitPeers(); broadcast(); }
      else if(hostConn && hostConn.open){ try{ hostConn.send({t:"p", pr:mine}); }catch(e){} emitPeers(); }
    },
    async leave(){ closed = true; try{ if(hostConn) hostConn.close(); }catch(e){} try{ peer.destroy(); }catch(e){} }
  };
}

async function enter(code, name, asHost){
  L.err = "";

  try{
    L.R = await L.api.join("wis-" + code.toLowerCase(), {code, host: asHost});
  }catch(e){ L.err = "Couldn't open the club (" + (e && e.code || "error") + "). Try again."; return render(); }
  L.code = code; L.name = name; L.isHost = asHost; L.joinedAt = Date.now();
  store.set("wis-me", {code, name, host: asHost, at: Date.now()});
  L.skipInvite = true;
  L.R.onPeers(ch => { L.peers = ch.peers; const me = ch.peers.find(p => p.sameTab); if(me) L.me = me.peer; tick(); }, () => {});
  L.R.onConnection(c => { L.connected = c; render(); }, () => {});
  if(asHost){
    const saved = store.get("wis-host", null);
    H = saved && saved.code === code ? saved : newHost(code);
  }
  pushPresence();
  render();
  setTimeout(render, 6500);
}
async function leave(){
  try{ if(L.R) await L.R.leave(); }catch(e){}
  // Leave means leave: only a host keeps a Rejoin line, to get back to their game.
  const was = store.get("wis-me", null); if(was && was.host) store.set("wis-last", Object.assign(was, {at: Date.now()})); else store.del("wis-last");
  L.R = null; L.code = null; L.isHost = false; L.peers = []; H = null; lastPresence = ""; store.del("wis-me");
  L.skipInvite = true;
  render();
}
function pushPresence(extra){
  if(!L.R) return;
  const p = Object.assign({n: L.name, h: L.isHost ? 1 : 0}, extra || {});
  if(L.isHost && H) p.st = project();
  const j = JSON.stringify(p);
  if(j === lastPresence) return;
  lastPresence = j;
  const me = store.get("wis-me", null); if(me && me.code === L.code) store.set("wis-me", Object.assign(me, {at: Date.now()}));
  L.R.presence(p).catch(() => {});
}
let myVote = null;   // {vid, t}
function vote(target){ myVote = {vid: st().vid, t: target}; pushPresence({v: myVote}); render(); }

// Called on every room change.
function tick(){
  if(L.isHost && H){ hostSync(); pushPresence(myVote ? {v: myVote} : null); }
  render();
}

// ---- host engine ----
function newHost(code){ return {code, level:1, cat:"All", lang:"en", scores:{}, startedBy:[], used:[], game:null}; }
function saveHost(){ store.set("wis-host", H); }
const present = () => L.peers.filter(p => p.kind === "viewer" && p.presence && cleanName(p.presence.n));
function lobbyNames(){
  const seen = {}, out = [];
  present().forEach(p => { const b = cleanName(p.presence.n); seen[b] = (seen[b]||0)+1; out.push({p: p.peer, b, n: seen[b] > 1 ? b + " " + seen[b] : b}); });
  return out;
}
function hostSync(){
  const G = H.game; if(!G) return;
  const here = new Set(present().map(p => p.peer));
  // A player who reloaded comes back as a new peer with the same name: give them their seat back.
  G.P.forEach(x => {
    if(here.has(x.p)) return;
    const back = present().find(p => cleanName(p.presence.n) === x.b && !G.P.some(y => y.p === p.peer));
    if(back) x.p = back.peer;
  });
  if(G.ph === "vote"){
    const votes = collectVotes();
    const voters = G.P.filter(x => canVote(x) && here.has(x.p));
    if(voters.length && voters.every(x => votes.has(x.p))) tally();
  }
}
// In a tie-break the tied players don't vote; everyone else picks between them.
const canVote = x => x.a && !(H.game.tie && H.game.cd.includes(x.p));
function collectVotes(){
  const G = H.game, m = new Map();
  present().forEach(p => {
    const v = p.presence.v, me = G.P.find(x => x.p === p.peer);
    if(me && canVote(me) && v && v.vid === G.vid && G.cd.includes(v.t) && v.t !== p.peer) m.set(p.peer, v.t);
  });
  return m;
}
function pickPair(){
  const cats = H.cat === "All" ? Object.keys(BANK) : [H.cat];
  // Pairs tagged "en" or "zh" only work in that language; Both mode uses untagged pairs only.
  const fits = p => H.lang === "both" ? !p[4] : (!p[4] || p[4] === H.lang);
  const pool = cats.flatMap(c => BANK[c]).filter(fits);
  let fresh = pool.filter(p => !H.used.includes(pairKey(p)));
  if(!fresh.length){ H.used = []; fresh = pool; }
  // Thumbs-up pairs are picked more often; 1 in 5 games tries a pair with few ratings.
  const rated = p => L.ratings[pairKey(p)] || {up:0, down:0};
  let cand = fresh;
  if(Math.random() < 0.2){ const few = fresh.filter(p => rated(p).up + rated(p).down < 3); if(few.length) cand = few; }
  const w = cand.map(p => Math.max(0.2, 1 + rated(p).up - rated(p).down));
  let r = Math.random() * w.reduce((a,b)=>a+b,0), i = 0;
  while(r > w[i]){ r -= w[i]; i++; }
  const p = cand[Math.min(i, cand.length-1)];
  H.used.push(pairKey(p));
  return p;
}
const wordText = w => !w ? "" : H.lang === "en" ? w.en : H.lang === "zh" ? w.zh : `${w.en} · ${w.zh}`;
function startGame(){
  const ps = lobbyNames();
  if(ps.length < 3) return;
  const p = pickPair();
  const A = {en:p[0], zh:p[1]}, B = {en:p[2], zh:p[3]};
  const [com, spyW] = Math.random() < .5 ? [A,B] : [B,A];
  const P = ps.map(x => ({p:x.p, b:x.b, n:x.n, r:"c", w:wordText(com), a:true}));
  const idx = shuffle(P.map((_,i)=>i)), lv = H.level, spies = lv >= 4 ? 2 : 1;
  idx.slice(0, spies).forEach((k, j) => { P[k].r = "s"; P[k].w = (lv === 4 && j === 1) ? "" : wordText(spyW); });
  const rest = idx.slice(spies);
  if(lv === 2) rest.slice(0,2).forEach(k => P[k].w = "");
  if(lv === 3 || lv === 5) rest.forEach(k => P[k].w = "");
  // Each game a different starter: random among players who haven't started yet in this club.
  let left = P.filter(x => !H.startedBy.includes(x.n));
  if(!left.length){ H.startedBy = []; left = P; }
  const s = left[Math.floor(Math.random()*left.length)];
  H.startedBy.push(s.n);
  H.game = {gid: Date.now(), pk: pairKey(p), cw: wordText(com), sw: wordText(spyW), P, st: s.n, rd: 1, ph: "describe", vid: 0, cd: [], tie: false, lo: "", win: ""};
  myVote = null; saveHost(); tick();
}
function startVote(cands){
  const G = H.game; G.vid = Date.now(); G.cd = cands; G.ph = "vote"; myVote = null;
  if(!G.P.some(canVote)) return tally();
  saveHost(); tick();
}
function tally(){
  const G = H.game, votes = collectVotes(), count = {};
  votes.forEach(t => count[t] = (count[t]||0) + 1);
  const keys = Object.keys(count);
  if(!keys.length){ G.tie = false; G.lo = ""; G.ph = "nobody"; return done(); }
  const max = Math.max(...Object.values(count)), top = keys.filter(k => count[k] === max);
  if(top.length > 1){
    if(G.tie){ G.tie = false; G.lo = ""; G.ph = "nobody"; return done(); }
    G.tie = true; G.cd = top; G.ph = "tie"; return done();
  }
  G.tie = false;
  const out = G.P.find(x => x.p === top[0]); out.a = false; G.lo = out.n;
  // Commoners win once every spy is out. Otherwise spies win at 2 players left (one-spy levels) or 3 (two-spy levels).
  if(!G.P.some(x => x.r === "s" && x.a)) return finish("c");
  const spies = G.P.filter(x => x.r === "s").length, living = G.P.filter(x => x.a).length;
  if(living <= (spies >= 2 ? 3 : 2)) return finish("s");
  G.ph = "out"; done();
}
function finish(side){
  const G = H.game; G.win = side; G.ph = "over";
  G.P.forEach(x => { if(x.r === side) H.scores[x.n] = (H.scores[x.n]||0) + (side === "s" ? 2 : 1); });
  done();
}
function done(){ myVote = null; saveHost(); pushPresence(); render(); }
function nextRound(){ const G = H.game; G.rd++; G.ph = "describe"; G.vid = 0; myVote = null; saveHost(); tick(); }

// What the host shares with every phone (kept small: presence is capped at 4 KiB).
function project(){
  const G = H.game, base = {code:H.code, lv:H.level, lang:H.lang, cat:H.cat, sc:Object.entries(H.scores).sort((a,b)=>b[1]-a[1]).slice(0,30)};
  if(!G || G.ph === "lobby") return Object.assign(base, {ph:"lobby", lob: lobbyNames().map(x => x.n).slice(0,40)});
  const o = Object.assign(base, {ph:G.ph, gid:G.gid, rd:G.rd, st:G.st, vid:G.vid, cd:G.cd, tie:G.tie?1:0, lo:G.lo, win:G.win, pk:G.pk,
    pl: G.P.map(x => [x.p, x.n, x.a?1:0]), w: Object.fromEntries(G.P.map(x => [x.p, x.w]))});
  if(G.ph === "vote"){ const v = collectVotes(); o.nv = v.size; o.nt = G.P.filter(canVote).length; }
  if(G.ph === "over"){ o.ro = Object.fromEntries(G.P.map(x => [x.p, x.r])); o.cw = G.cw; o.sw = G.sw; }
  return o;
}

// ---- what every phone reads ----
function hostPeer(){ return L.peers.find(p => p.presence && p.presence.h === 1 && p.presence.st && p.presence.st.code === L.code); }
function st(){ if(L.isHost && H) return project(); const h = hostPeer(); return h ? h.presence.st : null; }

const byId = id => document.getElementById(id);
// Leaving takes two taps, so nobody leaves the club by accident.
function sureLeave(btn, then){
  if(!btn) return;

    btn.dataset.sure = "1"; const was = btn.textContent; btn.textContent = "Tap again to leave";
    setTimeout(() => { if(btn.isConnected){ delete btn.dataset.sure; btn.textContent = was; } }, 3000);
  };
}

    <p class="golden"><b>The one rule: always describe your own word truthfully.</b> Every clue must be true about the word you were given, even if you suspect your word is different from everyone else's. Never say something that isn't true about your word just to match the others. (If you have no word, you'll have to bluff from what you hear.)</p>

function game(S, meIn){
  const nameOf = p => { const x = S.pl.find(y => y[0] === p); return x ? x[1] : "?"; };
  const alive = meIn[2] === 1, myWord = S.w ? S.w[L.me] : "";
  const starterIn = S.pl.some(x => x[1] === S.st && x[2] === 1);
  const roster = `<ul class="list">${S.pl.map(x => `<li class="${x[2] ? "" : "out"}"><span>${esc(x[1])}${x[0]===L.me ? " (you)" : ""}</span>${x[1]===S.st && x[2] ? '<span class="chip">Starts</span>' : ""}</li>`).join("")}</ul>`;
  const reveal = `<div class="reveal" id="rv" tabindex="0" role="button" aria-label="Hold to see your word"><div id="rvt"><span class="muted">Hold to see your word</span></div></div>`;
  const tag = `<span class="tag">Level ${S.lv} · Round ${S.rd}${alive ? "" : " · You're out"}</span>`;
  let body = "", host = "", bind = null;
  if(S.ph === "describe"){
    body = `${tag}<h1>${starterIn ? `${esc(S.st)} starts` : `${esc(S.st)} is out`}</h1>
      <p class="muted">${starterIn ? "Then go clockwise around the table." : "The next person clockwise who is still in starts, then go clockwise."} Say one clue about your own word, out loud. It must be true about your word.</p>
      ${alive ? reveal : `<p class="muted">You're out. Stay quiet and watch.</p>`}${roster}`;
    host = `<button class="primary" id="hx">${S.rd === 1 ? "Everyone has spoken, next round" : "Everyone has spoken, vote"}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = () => S.rd === 1 ? nextRound() : startVote(H.game.P.filter(x => x.a).map(x => x.p)); };
  } else if(S.ph === "vote"){
    const mine = myVote && myVote.vid === S.vid ? myVote.t : null;
    const opts = S.cd.filter(p => p !== L.me);
    const tied = S.tie && S.cd.includes(L.me), canV = alive && !tied;
    body = `<span class="tag">${S.tie ? "Tie-break vote" : "Secret vote"} · Round ${S.rd}</span>
      ${!alive ? `<h1>Voting</h1><p class="muted">You're out, so you don't vote this time.</p>`
        : tied ? `<h1>Everyone else is voting</h1><p class="muted">You're one of the tied players, so you don't vote this time.</p>`
        : mine ? `<h1>Vote in</h1><p class="muted">You picked ${esc(nameOf(mine))}. Waiting for everyone else. Tap another name to change it.</p>`
        : `<h1>Who is the spy?</h1><p class="muted">Tap one name. Nobody will see who you picked.</p>`}
      ${canV ? `<div class="picks">${opts.map(p => `<button class="pick" data-p="${esc(p)}" aria-pressed="${mine===p}" ${mine===p ? 'style="border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)"' : ""}>${esc(nameOf(p))}</button>`).join("")}</div>` : ""}
      ${alive ? reveal : ""}`;
    host = `<p class="muted">${S.nv} of ${S.nt} have voted. The result shows as soon as everyone has.</p><button id="hx">End the vote now</button>`;
    bind = () => { app.querySelectorAll(".pick").forEach(b => b.onclick = () => vote(b.dataset.p)); const b = byId("hx"); if(b) b.onclick = tally; };
  } else if(S.ph === "tie"){
    body = `<span class="stamp">Tie vote</span><h1>${S.cd.map(p => esc(nameOf(p))).join(" and ")} are tied</h1>
      <p class="muted">Only they describe their word once more. Then everyone else votes between just them. The tied players don't vote.</p>${alive ? reveal : ""}`;
    host = `<button class="primary" id="hx">They've spoken, vote again</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = () => startVote(H.game.cd); };
  } else if(S.ph === "nobody"){
    body = `<span class="stamp">Tied again</span><h1>Nobody is out this round</h1><p class="muted">Play moves on to the next round.</p>`;
    host = `<button class="primary" id="hx">Start round ${S.rd + 1}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = nextRound; };
  } else if(S.ph === "out"){
    body = `<span class="stamp">Voted out</span><h1>${esc(S.lo)} is out</h1>
      <p class="muted">${S.lo === meIn[1] ? "That's you. Keep your word to yourself until the end." : "Their word stays secret until the game ends. The game goes on."}</p>${roster}`;
    host = `<button class="primary" id="hx">Start round ${S.rd + 1}</button>`;
    bind = () => { const b = byId("hx"); if(b) b.onclick = nextRound; };
  } else if(S.ph === "over"){
    return over(S);
  }
  paint(`<section class="card">${body}${L.isHost ? `<div class="hostbar"><span class="tag">Host</span>${host}</div>` : ""}</section>`, () => {
    bind && bind();
    const rv = byId("rv"), t = byId("rvt");
    if(!rv) return;
    const show = on => { rv.classList.toggle("on", on); t.innerHTML = on ? (myWord ? `<div class="word">${esc(myWord)}</div>` : `<div class="word">You have no word</div><p class="muted">你没有词 · listen and blend in</p>`) : `<span class="muted">Hold to see your word</span>`; };
    rv.addEventListener("pointerdown", e => { e.preventDefault(); show(true); });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => rv.addEventListener(ev, () => show(false)));
    rv.addEventListener("contextmenu", e => e.preventDefault());
    rv.addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); show(true); } });
    rv.addEventListener("keyup", () => show(false));
  });
}

function over(S){
  const spy = S.win === "s", r = L.rated[S.gid] || null;
  paint(`<section class="card">
    <span class="stamp ${spy ? "" : "good"}">${spy ? "Spies win" : "Commoners win"}</span>
    <h1>${S.lo ? `${esc(S.lo)} was voted out. ` : ""}${spy ? "The spies made it to the end." : "Every spy has been caught."}</h1>
    <p class="muted">Commoner word: <b>${esc(S.cw)}</b> · Spy word: <b>${esc(S.sw)}</b></p>
    <ul class="list">${S.pl.map(x => `<li><span>${esc(x[1])} · ${S.w[x[0]] ? esc(S.w[x[0]]) : "<i>blank</i>"}</span><span class="chip ${S.ro[x[0]]==="s" ? "spy" : ""}">${S.ro[x[0]]==="s" ? "Spy" : "Commoner"}</span></li>`).join("")}</ul>
  </section>
  <section class="card"><h2>Fun pair?</h2>
    <div class="thumbs"><button id="up" aria-pressed="${r==="up"}">👍 Yes</button><button id="dn" aria-pressed="${r==="down"}">👎 No</button></div>
    <p class="muted">For now ratings stay on your phone. Later they'll count across all clubs.</p></section>
  <section class="card">${board(S, true)}
    ${L.isHost ? `<div class="row"><button class="primary" id="again">Play again</button><button id="lob">Change level</button></div>` : `<p class="muted">The host starts the next game.</p>`}
  </section>`, () => {
    const rate = v => {
      const k = S.pk, cur = L.ratings[k] || {up:0, down:0}, was = L.rated[S.gid];
      if(was) cur[was]--; if(was === v){ L.rated[S.gid] = null; } else { cur[v]++; L.rated[S.gid] = v; }
      L.ratings[k] = cur; store.set("wis-ratings", L.ratings); render();
    };
    byId("up").onclick = () => rate("up"); byId("dn").onclick = () => rate("down");
    const a = byId("again"); if(a) a.onclick = startGame;
    const lb = byId("lob"); if(lb) lb.onclick = () => { H.game = null; saveHost(); tick(); };
    const rs = byId("rs"); if(rs) rs.onclick = () => { H.scores = {}; saveHost(); tick(); };
  });
}

// ---- boot ----
byId("rulesBtn").onclick = () => { L.showRules ? closeRules() : (L.showRules = true, lastHtml = "", window.scrollTo(0,0), render()); };
try{ if(new URLSearchParams(location.search).has("rules")) L.showRules = true; }catch(e){}
render();
(async () => {
  let api = null;
  if(window.Peer) api = peerNet;
  else try{ api = window.claude && window.claude.use ? await window.claude.use("room") : null; }catch(e){ api = null; }
  L.api = api;
  render();
  // Came back after closing the page or losing the connection: go straight back into the club.
  const me = store.get("wis-me", null), saved = store.get("wis-host", null);
  if(api && me && me.code && me.name && (!me.at || Date.now() - me.at < FRESH) && !L.code && (!validCode(inviteCode) || inviteCode === me.code))
    enter(me.code, me.name, !!(me.host && saved && saved.code === me.code));
})();
</script>

</body>
</html>
