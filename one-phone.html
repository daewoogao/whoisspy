<html lang="en">
<head>

<title>WhoIsSpy</title>

<style>
/* Layout: one phone-width "case file" card per screen, passed hand to hand. */
:root{
  --bg:#eef0f6; --card:#ffffff; --ink:#1b1f3a; --muted:#5b6185; --line:#d6d9e8;
  --accent:#3b3fd8; --accent-ink:#ffffff; --stamp:#e2483d; --good:#1f8a5b; --chip:#e6e8fb;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142a; --card:#1c1f3d; --ink:#eceefb; --muted:#a3a8cc; --line:#2f3360;
  --accent:#8f93ff; --accent-ink:#12142a; --stamp:#ff7a6e; --good:#4fd39a; --chip:#2a2e5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142a; --card:#1c1f3d; --ink:#eceefb; --muted:#a3a8cc; --line:#2f3360;
  --accent:#8f93ff; --accent-ink:#12142a; --stamp:#ff7a6e; --good:#4fd39a; --chip:#2a2e5a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--body); padding-inline:16px; padding-block:20px}
.wrap{max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px}
.logo{font:800 22px/1 var(--display); letter-spacing:-.01em}
.logo span{color:var(--stamp)}
.tag{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:14px}
h1{font:800 28px/1.15 var(--display); margin:0; text-wrap:balance}
h2{font:800 18px/1.2 var(--display); margin:0}
p{margin:0}
.muted{color:var(--muted)}
label{font-weight:800; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
textarea,select{width:100%; box-sizing:border-box; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
textarea{min-height:150px; resize:vertical}
.field{display:flex; flex-direction:column; gap:6px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1 1 140px; min-width:0}
button{font:800 16px/1 var(--body); border-radius:14px; padding:15px 18px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,.pick:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button:disabled{opacity:.45; cursor:default}
.levels{display:grid; gap:8px}
.level{display:flex; gap:12px; align-items:flex-start; text-align:left; padding:12px 14px; font-weight:600; line-height:1.35}
.level b{font:800 20px/1 var(--display); min-width:22px}
.level small{display:block; color:var(--muted); font-weight:600; margin-top:3px}
.level[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.warn{color:var(--stamp); font-weight:700; font-size:14px}
.reveal{display:grid; place-items:center; min-height:190px; border-radius:16px; border:2px dashed var(--line); background:var(--bg); user-select:none; -webkit-user-select:none; touch-action:none; text-align:center; padding:16px; cursor:pointer}
.reveal.on{border-style:solid; border-color:var(--accent)}
.word{font:800 40px/1.1 var(--display); text-wrap:balance}
.list{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.list li{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--bg)}
.list li.out{opacity:.45; text-decoration:line-through}
.chip{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:999px; background:var(--chip); color:var(--ink)}
.chip.spy{background:var(--stamp); color:#fff}
.picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
.pick{padding:16px 10px}
.stamp{align-self:flex-start; font:800 13px/1 var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--stamp); border:2px solid var(--stamp); border-radius:6px; padding:6px 8px; transform:rotate(-3deg)}
.stamp.good{color:var(--good); border-color:var(--good)}
.score{font-variant-numeric:tabular-nums; font-weight:800}
.thumbs{display:flex; gap:10px}
.thumbs button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.foot{font-size:13px; color:var(--muted); text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header><div class="logo">Who<span>Is</span>Spy</div><div style="display:flex;align-items:center;gap:10px"><span class="tag">Pass the phone</span><a href="./?rules" style="font:800 13px/1 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--card)">Rules</a></div></header>

<script>
const BANK = {"Food and drink": [["Coffee", "咖啡", "Tea", "茶"], ["Dumpling", "饺子", "Wonton", "馄饨"], ["Pizza", "披萨", "Pie", "馅饼"], ["Ice cream", "冰淇淋", "Frozen yogurt", "冻酸奶"], ["Spaghetti", "意大利面", "Ramen", "拉面"], ["Milk", "牛奶", "Soy milk", "豆浆"], ["Butter", "黄油", "Cheese", "奶酪"], ["Honey", "蜂蜜", "Syrup", "糖浆"], ["Watermelon", "西瓜", "Cantaloupe", "哈密瓜"], ["Strawberry", "草莓", "Cherry", "樱桃"], ["Hot pot", "火锅", "Barbecue", "烧烤"], ["Sushi", "寿司", "Rice ball", "饭团"], ["Mooncake", "月饼", "Rice dumpling", "粽子"], ["Steamed bun", "馒头", "Bread", "面包"], ["Cola", "可乐", "Sparkling water", "苏打水"], ["Chocolate", "巧克力", "Candy", "糖果"], ["Vinegar", "醋", "Soy sauce", "酱油"], ["Orange", "橙子", "Tangerine", "橘子"], ["Bubble tea", "珍珠奶茶", "Milkshake", "奶昔"], ["Popcorn", "爆米花", "Potato chips", "薯片"], ["French fries", "薯条", "Hash browns", "薯饼"], ["Steamed stuffed bun", "包子", "Dumpling", "饺子", "zh"], ["Fried dough stick", "油条", "Fried dough twist", "麻花", "zh"], ["Stinky tofu", "臭豆腐", "Durian", "榴莲", "zh"], ["Jianbing", "煎饼果子", "Roujiamo", "肉夹馍", "zh"], ["Spicy gluten strips", "辣条", "Beef jerky", "牛肉干", "zh"], ["Pancake", "松饼", "Waffle", "华夫饼", "en"]], "Animals": [["Cat", "猫", "Tiger", "老虎"], ["Butterfly", "蝴蝶", "Moth", "飞蛾"], ["Dolphin", "海豚", "Shark", "鲨鱼"], ["Rabbit", "兔子", "Hamster", "仓鼠"], ["Penguin", "企鹅", "Duck", "鸭子"], ["Horse", "马", "Zebra", "斑马"], ["Wolf", "狼", "Fox", "狐狸"], ["Crocodile", "鳄鱼", "Lizard", "蜥蜴"], ["Bee", "蜜蜂", "Mosquito", "蚊子"], ["Owl", "猫头鹰", "Eagle", "老鹰"], ["Frog", "青蛙", "Turtle", "乌龟"], ["Panda", "熊猫", "Koala", "考拉"], ["Giraffe", "长颈鹿", "Camel", "骆驼"], ["Goldfish", "金鱼", "Parrot", "鹦鹉"], ["Snake", "蛇", "Earthworm", "蚯蚓"], ["Sheep", "绵羊", "Goat", "山羊", "en"], ["Squirrel", "松鼠", "Mouse", "老鼠"], ["Peacock", "孔雀", "Flamingo", "火烈鸟"], ["Spider", "蜘蛛", "Ant", "蚂蚁"], ["Octopus", "章鱼", "Jellyfish", "水母"], ["Magpie", "喜鹊", "Crow", "乌鸦", "zh"], ["Dragon", "龙", "Phoenix", "凤凰", "zh"], ["Qilin", "麒麟", "Unicorn", "独角兽", "zh"], ["Alligator", "短吻鳄", "Crocodile", "鳄鱼", "en"]], "Places": [["Beach", "海滩", "Swimming pool", "游泳池"], ["Library", "图书馆", "Bookstore", "书店"], ["Hospital", "医院", "Pharmacy", "药店"], ["Cinema", "电影院", "Theater", "剧院"], ["Airport", "机场", "Train station", "火车站"], ["Hotel", "酒店", "Dormitory", "宿舍"], ["Supermarket", "超市", "Convenience store", "便利店"], ["Zoo", "动物园", "Aquarium", "水族馆"], ["Gym", "健身房", "Park", "公园"], ["Kindergarten", "幼儿园", "Playground", "游乐场"], ["Church", "教堂", "Temple", "寺庙"], ["Bank", "银行", "Post office", "邮局"], ["Restaurant", "餐厅", "Cafeteria", "食堂"], ["Museum", "博物馆", "Art gallery", "美术馆"], ["Elevator", "电梯", "Escalator", "扶梯"], ["Kitchen", "厨房", "Bathroom", "浴室"], ["Mountain", "山", "Island", "岛"], ["Desert", "沙漠", "Grassland", "草原"], ["Wedding", "婚礼", "Birthday party", "生日派对"], ["Classroom", "教室", "Office", "办公室"], ["Wet market", "菜市场", "Supermarket", "超市", "zh"], ["Temple fair", "庙会", "Night market", "夜市", "zh"], ["Bathhouse", "澡堂", "Hot spring", "温泉", "zh"], ["Motel", "汽车旅馆", "Hotel", "酒店", "en"]], "Everyday objects": [["Pillow", "枕头", "Cushion", "靠垫"], ["Toothbrush", "牙刷", "Comb", "梳子"], ["Umbrella", "雨伞", "Raincoat", "雨衣"], ["Mirror", "镜子", "Window", "窗户"], ["Glasses", "眼镜", "Sunglasses", "墨镜"], ["Chopsticks", "筷子", "Fork", "叉子"], ["Scissors", "剪刀", "Knife", "刀"], ["Pen", "钢笔", "Chalk", "粉笔", "en"], ["Key", "钥匙", "Password", "密码"], ["Wallet", "钱包", "Backpack", "背包"], ["Candle", "蜡烛", "Flashlight", "手电筒"], ["Socks", "袜子", "Gloves", "手套"], ["Phone", "手机", "Walkie-talkie", "对讲机"], ["Clock", "时钟", "Calendar", "日历"], ["Blanket", "毯子", "Towel", "毛巾"], ["Lipstick", "口红", "Crayon", "蜡笔"], ["Fan", "风扇", "Air conditioner", "空调"], ["Bottle", "瓶子", "Cup", "杯子"], ["Balloon", "气球", "Bubble", "泡泡"], ["Ladder", "梯子", "Stairs", "楼梯", "en"], ["Red envelope", "红包", "Spring couplets", "对联", "zh"], ["Abacus", "算盘", "Calculator", "计算器", "zh"], ["Firecracker", "鞭炮", "Fireworks", "烟花", "zh"], ["Mug", "马克杯", "Cup", "杯子", "en"]], "Jobs": [["Doctor", "医生", "Nurse", "护士"], ["Chef", "厨师", "Waiter", "服务员"], ["Teacher", "老师", "Coach", "教练"], ["Police officer", "警察", "Security guard", "保安"], ["Firefighter", "消防员", "Lifeguard", "救生员"], ["Pilot", "飞行员", "Flight attendant", "空乘"], ["Singer", "歌手", "Actor", "演员"], ["Dentist", "牙医", "Barber", "理发师"], ["Lawyer", "律师", "Judge", "法官"], ["Farmer", "农民", "Gardener", "园丁"], ["Journalist", "记者", "Writer", "作家"], ["Photographer", "摄影师", "Painter", "画家"], ["Magician", "魔术师", "Clown", "小丑"], ["Taxi driver", "出租车司机", "Delivery rider", "外卖员"], ["Programmer", "程序员", "Hacker", "黑客"], ["Astronaut", "宇航员", "Diver", "潜水员"], ["Tour guide", "导游", "Host", "主持人"], ["Vet", "兽医", "Zookeeper", "饲养员"], ["Cashier", "收银员", "Bank teller", "银行柜员"], ["Model", "模特", "Influencer", "网红"], ["Homeroom teacher", "班主任", "College counselor", "辅导员", "zh"], ["Matchmaker", "媒婆", "Old Man under the Moon", "月老", "zh"], ["Landlady", "包租婆", "Real estate agent", "房产中介", "zh"], ["Chef", "主厨", "Cook", "厨师", "en"]], "Sports and hobbies": [["Badminton", "羽毛球", "Tennis", "网球"], ["Skiing", "滑雪", "Skating", "滑冰", "en"], ["Painting", "绘画", "Drawing", "素描"], ["Basketball", "篮球", "Volleyball", "排球"], ["Soccer", "足球", "Rugby", "橄榄球"], ["Swimming", "游泳", "Diving", "潜水"], ["Yoga", "瑜伽", "Tai chi", "太极"], ["Chess", "国际象棋", "Go", "围棋", "zh"], ["Karaoke", "卡拉OK", "Concert", "演唱会"], ["Fishing", "钓鱼", "Camping", "露营"], ["Boxing", "拳击", "Kung fu", "功夫"], ["Ping pong", "乒乓球", "Billiards", "台球"], ["Running", "跑步", "Hiking", "徒步", "en"], ["Dancing", "跳舞", "Gymnastics", "体操"], ["Cycling", "骑自行车", "Horse riding", "骑马"], ["Surfing", "冲浪", "Skateboarding", "滑板"], ["Knitting", "织毛衣", "Sewing", "缝纫"], ["Mahjong", "麻将", "Poker", "扑克"], ["Bowling", "保龄球", "Golf", "高尔夫"], ["Jigsaw puzzle", "拼图", "Lego", "乐高"], ["Flying a kite", "放风筝", "Paper planes", "纸飞机"], ["Square dancing", "广场舞", "Aerobics", "健身操", "zh"], ["Shuttlecock kicking", "踢毽子", "Hopscotch", "跳房子", "zh"], ["Dou Dizhu", "斗地主", "Guandan", "掼蛋", "zh"]]};
const LEVELS = [
  {n:1, title:"One spy", desc:"The spy has a different word.", min:4},
  {n:2, title:"One spy, two blanks", desc:"The spy has a different word. Two commoners have no word.", min:6},
  {n:3, title:"One spy, all blank", desc:"Only the spy has a word. Every commoner is blank.", min:4},
  {n:4, title:"Two spies", desc:"One spy has a different word, the other spy is blank.", min:6},
  {n:5, title:"Two spies, all blank", desc:"Both spies have a word. Every commoner is blank.", min:6}
];

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let S = {
  names: "Amy\nBen\nChloe\nDavid\nEmma\nFrank",
  level: 1, cat: "All", lang: "en", startedBy: [],
  used: [], scores: {}, ratings: store.get("wis-ratings", {}), game: null, held: false
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const players = () => S.names.split("\n").map(s=>s.trim()).filter(Boolean);
const wordText = w => !w ? null : S.lang==="en" ? w.en : S.lang==="zh" ? w.zh : `${w.en} · ${w.zh}`;
const pairKey = p => p[0]+"/"+p[2];

function pickPair(){
  const cats = S.cat==="All" ? Object.keys(BANK) : [S.cat];
  // Pairs tagged "en" or "zh" only work in that language; Both mode uses untagged pairs only.
  const fits = p => S.lang==="both" ? !p[4] : (!p[4] || p[4]===S.lang);
  let pool = cats.flatMap(c => BANK[c]).filter(fits);
  let fresh = pool.filter(p => !S.used.includes(pairKey(p)));
  if(!fresh.length){ S.used = []; fresh = pool; }
  // Thumbs-up pairs are picked more often; 1 in 5 games tries a pair with few ratings.
  const rated = p => S.ratings[pairKey(p)] || {up:0, down:0};
  let cand = fresh;
  if(Math.random() < 0.2){ const few = fresh.filter(p => rated(p).up + rated(p).down < 3); if(few.length) cand = few; }
  const weights = cand.map(p => Math.max(0.2, 1 + rated(p).up - rated(p).down));
  let r = Math.random() * weights.reduce((a,b)=>a+b,0), i = 0;
  while(r > weights[i]){ r -= weights[i]; i++; }
  const p = cand[Math.min(i, cand.length-1)];
  S.used.push(pairKey(p));
  return p;
}

function pickStarter(names){
  let left = names.filter(n => !S.startedBy.includes(n));
  if(!left.length){ S.startedBy = []; left = names.slice(); }
  const n = left[Math.floor(Math.random()*left.length)];
  S.startedBy.push(n);
  return names.indexOf(n);
}
function newGame(){
  const names = players();
  const p = pickPair();
  const A = {en:p[0], zh:p[1]}, B = {en:p[2], zh:p[3]};
  const [com, spyW] = Math.random() < .5 ? [A,B] : [B,A];
  const idx = shuffle(names.map((_,i)=>i));
  const roles = names.map(n => ({name:n, role:"com", word:com}));
  const L = S.level;
  const spyCount = L >= 4 ? 2 : 1;
  idx.slice(0, spyCount).forEach((k, j) => { roles[k].role = "spy"; roles[k].word = (L===4 && j===1) ? null : spyW; });
  const rest = idx.slice(spyCount);
  if(L===2) rest.slice(0,2).forEach(k => roles[k].word = null);
  if(L===3 || L===5) rest.forEach(k => roles[k].word = null);
  S.game = { pair:p, com, spyW, roles, alive:names.map(()=>true), round:1, phase:"pass", deal:0,
             starter: pickStarter(names), votes:{}, voters:[], vi:0, cands:null, tieRound:false, lastOut:null, winner:null, rated:null };
  render();
}

const g = () => S.game;
const order = () => { const G=g(), n=G.roles.length, o=[]; for(let k=0;k<n;k++){ const i=(G.starter+k)%n; if(G.alive[i]) o.push(i); } return o; };

function startVote(cands){
  const G = g();
  // In a tie-break the tied players don't vote; everyone else picks between them.
  G.cands = cands; G.votes = {}; G.voters = order().filter(i => !G.tieRound || !cands.includes(i)); G.vi = 0;
  if(!G.voters.length) return tally();
  G.phase = "votepass"; render();
}
function castVote(target){
  const G = g();
  G.votes[target] = (G.votes[target]||0) + 1; G.vi++;
  G.phase = G.vi >= G.voters.length ? "tally" : "votepass";
  if(G.phase==="tally") tally(); else render();
}
function tally(){
  const G = g();
  if(!Object.keys(G.votes).length){ G.tieRound=false; G.lastOut=null; G.phase="nobody"; render(); return; }
  const max = Math.max(...Object.values(G.votes));
  const top = Object.keys(G.votes).filter(k => G.votes[k]===max).map(Number);
  if(top.length > 1){
    if(G.tieRound){ G.tieRound=false; G.lastOut=null; G.phase="nobody"; render(); return; }
    G.tieRound = true; G.cands = top; G.phase = "tie"; render(); return;
  }
  G.tieRound = false;
  const out = top[0]; G.alive[out] = false; G.lastOut = out;
  // Commoners win once every spy is out. Otherwise spies win at 2 players left (one-spy levels) or 3 (two-spy levels).
  if(!G.roles.some((r,i)=>r.role==="spy" && G.alive[i])) return finish("com");
  const spies = G.roles.filter(r=>r.role==="spy").length;
  const living = G.alive.filter(Boolean).length;
  if(living <= (spies>=2 ? 3 : 2)) return finish("spy");
  G.phase = "out"; render();
}
function finish(side){
  const G = g(); G.winner = side; G.phase = "over";
  G.roles.forEach(r => { if(r.role===side) S.scores[r.name] = (S.scores[r.name]||0) + (side==="spy" ? 2 : 1); });
  render();
}
function rate(v){
  const G = g(), k = pairKey(G.pair); const r = S.ratings[k] || {up:0, down:0};
  if(G.rated) r[G.rated]--; if(G.rated===v){ G.rated=null; } else { r[v]++; G.rated=v; }
  S.ratings[k] = r; store.set("wis-ratings", S.ratings); render();
}
function nextRound(){ const G=g(); G.round++; G.phase="describe"; render(); }

function render(){
  const G = S.game;
  if(!G) return setup();
  const R = G.roles;
  const nm = i => esc(R[i].name);
  if(G.phase==="pass"){
    const i = G.deal;
    app.innerHTML = `<section class="card">
      <span class="tag">Dealing words · ${i+1} of ${R.length}</span>
      <h1>Pass the phone to ${nm(i)}</h1>
      <p class="muted">Press and hold the box to see your word. Let go to hide it.</p>
      <div class="reveal" id="rv" tabindex="0" role="button" aria-label="Hold to reveal your word">
        <div id="rvt"><span class="muted">Hold here</span></div></div>
      <button class="primary" id="nx">${i+1 < R.length ? "Got it, pass on" : "Got it, start round 1"}</button></section>`;
    const rv = document.getElementById("rv"), t = document.getElementById("rvt");
    const show = on => { rv.classList.toggle("on", on); t.innerHTML = on ? (R[i].word ? `<div class="word">${esc(wordText(R[i].word))}</div>` : `<div class="word">You have no word</div><p class="muted">你没有词 · listen and blend in</p>`) : `<span class="muted">Hold here</span>`; };
    rv.addEventListener("pointerdown", e => { e.preventDefault(); show(true); });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => rv.addEventListener(ev, () => show(false)));
    rv.addEventListener("keydown", e => { if(e.key===" "||e.key==="Enter"){ e.preventDefault(); show(true); } });
    rv.addEventListener("keyup", () => show(false));
    document.getElementById("nx").onclick = () => { G.deal++; if(G.deal >= R.length){ G.phase="describe"; } render(); };
    return;
  }
  if(G.phase==="describe"){
    const o = order();
    app.innerHTML = `<section class="card">
      <span class="tag">Level ${S.level} · Round ${G.round}</span>
      <h1>${G.alive[G.starter] ? `${nm(G.starter)} starts` : `${nm(G.starter)} is out`}</h1>
      <p class="muted">${G.alive[G.starter] ? "Then go clockwise around the table." : "The next person clockwise who is still in starts, then go clockwise."} Each person says one clue that is true about their own word, even if they think their word is different.</p>
      <p class="tag">Still in the game</p>
      <ul class="list">${R.map((r,i)=>`<li class="${G.alive[i]?"":"out"}"><span>${nm(i)}</span>${i===G.starter&&G.alive[i]?'<span class="chip">Starts</span>':''}</li>`).join("")}</ul>
      <button class="primary" id="go">${G.round===1 ? "Everyone has spoken, next round" : "Everyone has spoken, vote"}</button></section>`;
    document.getElementById("go").onclick = () => G.round===1 ? nextRound() : startVote(order());
    return;
  }
  if(G.phase==="votepass"){
    const v = G.voters[G.vi];
    const opts = G.cands.filter(i => i!==v);
    app.innerHTML = `<section class="card">
      <span class="tag">${G.tieRound ? "Tie-break vote" : "Secret vote"} · ${G.vi+1} of ${G.voters.length}</span>
      <h1>${nm(v)}, who is the spy?</h1>
      <p class="muted">Tap one name. Nobody will see who you picked.</p>
      <div class="picks">${opts.map(i=>`<button class="pick" data-i="${i}">${nm(i)}</button>`).join("")}</div>
      ${opts.length ? "" : `<button id="skip">Skip, nobody to vote for</button>`}</section>`;
    app.querySelectorAll(".pick").forEach(b => b.onclick = () => castVote(+b.dataset.i));
    const sk = document.getElementById("skip"); if(sk) sk.onclick = () => { G.vi++; G.vi>=G.voters.length ? tally() : render(); };
    return;
  }
  if(G.phase==="tie"){
    app.innerHTML = `<section class="card">
      <span class="stamp">Tie vote</span>
      <h1>${G.cands.map(nm).join(" and ")} are tied</h1>
      <p class="muted">Only they describe their word once more. Then everyone else votes between just them. The tied players don't vote.</p>
      <button class="primary" id="go">They've spoken, vote again</button></section>`;
    document.getElementById("go").onclick = () => startVote(G.cands);
    return;
  }
  if(G.phase==="nobody"){
    app.innerHTML = `<section class="card"><span class="stamp">Tied again</span>
      <h1>Nobody is out this round</h1><p class="muted">Play moves on to the next round.</p>
      <button class="primary" id="go">Start round ${G.round+1}</button></section>`;
    document.getElementById("go").onclick = nextRound; return;
  }
  if(G.phase==="out"){
    app.innerHTML = `<section class="card"><span class="stamp">Voted out</span>
      <h1>${nm(G.lastOut)} is out</h1>
      <p class="muted">Their word stays secret until the game ends. The game goes on.</p>
      <ol class="list">${R.map((r,i)=>`<li class="${G.alive[i]?"":"out"}"><span>${nm(i)}</span></li>`).join("")}</ol>
      <button class="primary" id="go">Start round ${G.round+1}</button></section>`;
    document.getElementById("go").onclick = nextRound; return;
  }
  if(G.phase==="over"){
    const spy = G.winner==="spy";
    const board = Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);
    app.innerHTML = `<section class="card">
      <span class="stamp ${spy?"":"good"}">${spy ? "Spies win" : "Commoners win"}</span>
      <h1>${G.lastOut!=null ? `${nm(G.lastOut)} was voted out. ` : ""}${spy ? "The spies made it to the end." : "Every spy has been caught."}</h1>
      <p class="muted">Commoner word: <b>${esc(wordText(G.com))}</b> · Spy word: <b>${esc(wordText(G.spyW))}</b></p>
      <ul class="list">${R.map((r,i)=>`<li><span>${nm(i)} · ${r.word ? esc(wordText(r.word)) : "<i>blank</i>"}</span><span class="chip ${r.role==="spy"?"spy":""}">${r.role==="spy"?"Spy":"Commoner"}</span></li>`).join("")}</ul>
    </section>
    <section class="card"><h2>Fun pair?</h2>
      <div class="thumbs"><button id="up" aria-pressed="${G.rated==="up"}">👍 Yes</button><button id="dn" aria-pressed="${G.rated==="down"}">👎 No</button></div>
      <p class="muted">Ratings stay on this phone and help pick better pairs next time.</p></section>
    <section class="card"><h2>Scoreboard</h2>
      <p class="muted">Spy win: 2 points each. Commoner win: 1 point each.</p>
      <ul class="list">${board.map(([n,s])=>`<li><span>${esc(n)}</span><span class="score">${s}</span></li>`).join("")}</ul>
      <div class="row"><button class="primary" id="again">Play again</button><button id="setup">Change players or level</button></div>
      <button id="reset">Reset scoreboard</button></section>`;
    document.getElementById("up").onclick = () => rate("up");
    document.getElementById("dn").onclick = () => rate("down");
    document.getElementById("again").onclick = () => newGame();
    document.getElementById("setup").onclick = () => { S.game=null; render(); };
    document.getElementById("reset").onclick = () => { S.scores = {}; render(); };
  }
}

function setup(){
  const n = players().length, L = LEVELS[S.level-1];
  app.innerHTML = `<section class="card">
    <h1>Set up the table</h1>
    <div class="field"><label for="names">Players, one name per line, any order</label>
      <textarea id="names" spellcheck="false">${esc(S.names)}</textarea>
      <span class="muted" id="cnt">${n} players</span></div>
    <div class="field"><label>Level</label><div class="levels">${LEVELS.map(l=>`<button class="level" data-l="${l.n}" aria-pressed="${S.level===l.n}"><b>${l.n}</b><span>${l.title}<small>${l.desc} Suggested: ${l.min}+ players.</small></span></button>`).join("")}</div></div>
    <div class="row">
      <div class="field"><label for="cat">Category</label><select id="cat">${["All",...Object.keys(BANK)].map(c=>`<option ${c===S.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="lang">Words in</label><select id="lang">
        <option value="en" ${S.lang==="en"?"selected":""}>English</option><option value="zh" ${S.lang==="zh"?"selected":""}>中文</option><option value="both" ${S.lang==="both"?"selected":""}>Both</option></select></div>
    </div>
    <p class="warn" id="warn" ${n < L.min ? "" : "hidden"}>Level ${L.n} plays best with ${L.min} or more players. You can still play.</p>
    <button class="primary" id="start" ${n < 3 ? "disabled" : ""}>Deal the words</button>
    <p class="muted" id="need" ${n < 3 ? "" : "hidden"}>Add at least 3 players to start.</p></section>`;
  const upd = () => { S.names = document.getElementById("names").value; const c = players().length, L2 = LEVELS[S.level-1];
    document.getElementById("cnt").textContent = c + " players";
    document.getElementById("warn").hidden = c >= L2.min; document.getElementById("start").disabled = c < 3; document.getElementById("need").hidden = c >= 3; };
  document.getElementById("names").addEventListener("input", upd);
  app.querySelectorAll(".level").forEach(b => b.onclick = () => { S.names = document.getElementById("names").value; S.level = +b.dataset.l; setup(); });
  document.getElementById("cat").onchange = e => S.cat = e.target.value;
  document.getElementById("lang").onchange = e => S.lang = e.target.value;
  document.getElementById("start").onclick = () => {
    const ps = players(); const seen = {};
    S.names = ps.map(p => { seen[p] = (seen[p]||0)+1; return seen[p]>1 ? `${p} ${seen[p]}` : p; }).join("\n");
    newGame();
  };
}

function start(data){ if(data && data.S){ S = Object.assign(S, data.S); } render(); }
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
